[package]
name = "pp-rider"
description = "Procedural road bike and rider meshes with a pedalling pose, for Penguin Pass"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
glam = "0.32"

[dev-dependencies]
# Only the glTF JSON types and the GLB container writer. The default
# features pull in image decoding, which the exporter does not need.
gltf = { version = "1.4", default-features = false, features = ["names"] }

[lints]
workspace = true

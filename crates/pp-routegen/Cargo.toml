[package]
name = "pp-routegen"
description = "Seeded course generator for Penguin Pass"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
pp-course = { path = "../pp-course" }
# ChaCha12 via rand 0.10.4 (`rngs::ChaCha12Rng`) is the stability promise.
# Locked bytes moved with the rand 0.10 bump; update fingerprint tests and
# docs/route-generator.md when bumping again.
rand = { version = "=0.10.4", features = ["chacha"] }
serde_json = "1"

[lints]
workspace = true

[package]
name = "pp-session"
description = "Ride orchestration and persisted settings for Penguin Pass"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
pp-cast = { path = "../pp-cast" }
pp-core = { path = "../pp-core" }
pp-course = { path = "../pp-course" }
pp-arcade = { path = "../pp-arcade" }
pp-bots = { path = "../pp-bots" }
pp-record = { path = "../pp-record" }
pp-strava = { path = "../pp-strava" }
pp-workout = { path = "../pp-workout" }
pp-routegen = { path = "../pp-routegen" }
pp-segments = { path = "../pp-segments" }
pp-trainer = { path = "../pp-trainer" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"

[dev-dependencies]
fitparser = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tiny_http = { version = "0.12", default-features = false }

[lints]
workspace = true

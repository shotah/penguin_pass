[package]
name = "pp-strava"
description = "Strava connect and ride upload for Penguin Pass"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
form_urlencoded = "1"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = { version = "0.12", default-features = false }
toml = "0.8"
# ureq's tls feature accepts any webpki-roots 0.26. 0.26.9 and later switched
# to CDLA-Permissive-2.0. 0.26.8 is still MPL-2.0.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
webpki-roots = "=0.26.8"

[lints]
workspace = true

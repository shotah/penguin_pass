<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Penguin Pass</title>
<style>
  @font-face {
    font-family: "Barlow Semi Condensed";
    src: url("/fonts/BarlowSemiCondensed-Medium.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
  }
  @font-face {
    font-family: "Barlow Semi Condensed";
    src: url("/fonts/BarlowSemiCondensed-SemiBold.ttf") format("truetype");
    font-weight: 600;
    font-style: normal;
  }
  @font-face {
    font-family: "Barlow Semi Condensed";
    src: url("/fonts/BarlowSemiCondensed-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html {
    height: 100%;
    background: #0B1220;
    color: #F4F8FF;
    font-family: "Barlow Semi Condensed", Arial, Helvetica, sans-serif;
    font-size: 16px;
    font-size: calc(100vw / 120);
  }
  @media (min-aspect-ratio: 16/9) {
    html { font-size: 16px; font-size: calc(100vh / 67.5); }
  }
  body {
    margin: 0;
    height: 100%;
    background: #0B1220;
    overflow: hidden;
  }
  .board {
    height: 100%;
    padding: 4.5rem;
    display: flex;
    flex-direction: column;
  }
  .board {
    display: grid;
    grid-template-columns: 1.57fr 1fr 1fr;
    grid-template-rows: auto 1fr 1fr 1fr;
    gap: 1.5rem;
  }
  .top { grid-column: 1 / -1; grid-row: 1; }
  .power { grid-column: 1; grid-row: 2 / span 2; }
  .speed { grid-column: 2; grid-row: 2; }
  .grade { grid-column: 3; grid-row: 2; }
  .cadence { grid-column: 2; grid-row: 3; }
  .heart { grid-column: 3; grid-row: 3; }
  .course { grid-column: 1 / -1; grid-row: 4; }
  .foot { display: none; }

  .top {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.7rem;
    min-height: 4.5rem;
  }
  .top-row {
    display: flex;
    align-items: center;
    min-height: 4.5rem;
  }
  .badge {
    width: 4.5rem;
    height: 4.5rem;
    border-radius: 0.85rem;
    margin-right: 1rem;
    flex: 0 0 auto;
  }
  .brand {
    display: flex;
    align-items: baseline;
    margin-right: 1.5rem;
    min-width: 0;
  }
  .brand-name {
    font-weight: 700;
    font-size: 2.75rem;
    line-height: 1;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .brand-course {
    margin-left: 0.9rem;
    font-weight: 500;
    font-size: 1.7rem;
    color: #B4C0D4;
    white-space: nowrap;
  }
  .trainer {
    margin-right: 1.5rem;
    font-weight: 600;
    font-size: 1.35rem;
    color: #B4C0D4;
    white-space: nowrap;
  }
  .trainer:before {
    content: "";
    display: inline-block;
    width: 0.7rem;
    height: 0.7rem;
    margin-right: 0.45rem;
    border-radius: 50%;
    vertical-align: 0.05rem;
    background: #7C8AA3;
  }
  .trainer.good { color: #F4F8FF; }
  .trainer.good:before { background: #3DD68C; }
  .trainer.warn { color: #FFB23E; }
  .trainer.warn:before { background: #FFB23E; }
  .trainer.sim:before {
    background: transparent;
    border: 0.12rem solid #B4C0D4;
  }
  .totals {
    margin-left: auto;
    display: flex;
    align-items: baseline;
  }
  .total { margin-left: 1.6rem; white-space: nowrap; }
  .k {
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #B4C0D4;
    margin-right: 0.45rem;
  }
  .v, .num, .big, .hero-num {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }
  .v { font-size: 2.75rem; }
  .stream {
    margin-left: 2rem;
    font-weight: 600;
    font-size: 1.7rem;
    color: #7C8AA3;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .stream:before {
    content: "";
    display: inline-block;
    width: 0.85rem;
    height: 0.85rem;
    margin-right: 0.5rem;
    border-radius: 50%;
    vertical-align: 0.05rem;
    background: #7C8AA3;
  }
  .stream.live { color: #3DD68C; }
  .stream.live:before { background: #3DD68C; }
  .stream.reconnecting { color: #FFB23E; }
  .stream.reconnecting:before {
    background: transparent;
    border: 0.14rem solid rgba(255, 178, 62, 0.28);
    border-top-color: #FFB23E;
    animation: turn 1s linear infinite;
  }
  @keyframes turn { to { transform: rotate(360deg); } }
  @keyframes burn {
    0%, 22% { transform: translate(0, 0); }
    25%, 47% { transform: translate(1px, 0); }
    50%, 72% { transform: translate(1px, 1px); }
    75%, 97% { transform: translate(0, 1px); }
  }
  .board { animation: burn 600s linear infinite; }

  .tile, .power, .course, .foot {
    background: #12203F;
    border-radius: 1.5rem;
    min-width: 0;
    min-height: 0;
  }
  .power {
    display: flex;
    align-items: center;
    padding: 1.5rem 2rem;
  }
  .ladder {
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 2.75rem;
    margin-right: 1.6rem;
    flex: 0 0 auto;
  }
  .seg {
    height: 3.15rem;
    width: 100%;
    border-radius: 0.15rem;
    margin-bottom: 0.2rem;
    opacity: 0.34;
  }
  .seg.on { opacity: 1; width: 118%; margin-left: -9%; }
  .hero-block { min-width: 0; }
  .hero-row { display: flex; align-items: baseline; }
  .hero-num {
    font-size: 20.625rem;
    line-height: 0.82;
    letter-spacing: -0.03em;
    min-width: 3.2ch;
  }
  .hero-w {
    margin-left: 0.6rem;
    font-weight: 500;
    font-size: 4.5rem;
    color: #B4C0D4;
  }
  .zone-name {
    margin-top: 0.4rem;
    font-weight: 700;
    font-size: 3rem;
    letter-spacing: 0.04em;
    color: #B4C0D4;
    min-height: 1.15em;
  }
  .hero-cap {
    margin-top: 0.35rem;
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #B4C0D4;
  }
  .tile {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 1.2rem 1.8rem;
  }
  .big {
    font-size: 10rem;
    line-height: 0.9;
    min-width: 4ch;
  }
  .unit {
    margin-top: 0.35rem;
    font-weight: 500;
    font-size: 2.25rem;
    color: #B4C0D4;
  }
  .missing { color: #7C8AA3; }
  .subbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.7rem;
  }
  .pill {
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 0.06em;
    line-height: 1;
    padding: 0.45rem 0.85rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .pill.draft { background: #5EEAD4; color: #042824; }
  .pill.fish { background: #FFD166; color: #2A1A04; }
  .pill.up { background: #D277FF; color: #1A0828; }
  .pill.up.feather { background: #D6E6FF; color: #0B1220; }
  .pill.up.aero { background: #4FA8FF; color: #041428; }
  .pill.up.burst { background: #FF9A3C; color: #2A1004; }
  .pill.reverse { background: #F4F8FF; color: #0B1220; }
  .workout, .segment {
    background: #12203F;
    border-radius: 1.5rem;
    min-width: 0;
  }
  .workout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    grid-template-rows: auto 0.4rem;
    column-gap: 1.2rem;
    row-gap: 0.45rem;
    align-items: center;
    flex: 1 1 0;
    padding: 0.7rem 1.2rem 0.65rem;
  }
  .workout-copy { grid-column: 1; grid-row: 1; min-width: 0; }
  .workout-name {
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #B4C0D4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .workout-block {
    font-weight: 700;
    font-size: 2.15rem;
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .workout-target {
    grid-column: 2;
    grid-row: 1;
    display: flex;
    align-items: center;
  }
  .workout-watts {
    font-size: 4rem;
    line-height: 0.9;
    letter-spacing: -0.03em;
  }
  .workout-unit {
    margin-left: 0.35rem;
    font-weight: 500;
    font-size: 1.7rem;
    color: #B4C0D4;
  }
  .erg {
    margin-left: 0.7rem;
    padding: 0.2rem 0.55rem;
    border-radius: 0.45rem;
    background: #3DD68C;
    color: #062818;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 0.08em;
  }
  .workout-time {
    grid-column: 3;
    grid-row: 1;
    font-size: 2.75rem;
    line-height: 0.9;
    min-width: 5.2ch;
    text-align: right;
  }
  .workout .track { grid-column: 1 / -1; grid-row: 2; }
  .segment {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex: 1 1 0;
    padding: 0.7rem 1.2rem;
  }
  .segment-name {
    font-weight: 700;
    font-size: 2.15rem;
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 0 1 auto;
    min-width: 0;
  }
  .segment-time {
    font-size: 2.5rem;
    line-height: 0.9;
    flex: 0 0 auto;
    min-width: 4.4ch;
  }
  .track {
    height: 0.4rem;
    background: #0B1220;
    border-radius: 999px;
    overflow: hidden;
    flex: 1 1 auto;
    min-width: 3rem;
  }
  .fill { height: 100%; width: 0%; border-radius: 999px; }
  .workout .fill { background: #FFD166; }
  .segment .fill { background: #4FA8FF; }
  .delta {
    flex: 0 0 auto;
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: 0.04em;
    line-height: 1;
    padding: 0.4rem 0.75rem;
    border-radius: 999px;
    white-space: nowrap;
    text-transform: uppercase;
  }
  .delta.ahead { background: #3DD68C; color: #062818; }
  .delta.behind { background: #FF5A52; color: #2A0604; }
  .delta.first { background: #243456; color: #F4F8FF; }
  .delta.even { background: #B4C0D4; color: #0B1220; }
  .course {
    display: flex;
    padding: 1rem 1.4rem 0.8rem;
  }
  .course-live { display: none; }
  .board.has-live { grid-template-rows: auto auto 1fr 1fr 1fr; }
  .board.has-live .course-live {
    display: flex;
    grid-column: 1 / -1;
    grid-row: 2;
    gap: 0.8rem;
    min-width: 0;
  }
  .board.has-live .power { grid-row: 3 / span 2; }
  .board.has-live .speed { grid-row: 3; }
  .board.has-live .grade { grid-row: 3; }
  .board.has-live .cadence { grid-row: 4; }
  .board.has-live .heart { grid-row: 4; }
  .board.has-live .course { grid-row: 5; }
  .course-main { flex: 1.7 1 0; min-width: 0; display: flex; flex-direction: column; }
  .course-next { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; margin-left: 1.5rem; }
  .cap {
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #B4C0D4;
    flex: 0 0 auto;
  }
  .course canvas { width: 100%; flex: 1 1 auto; min-height: 0; display: block; }
  body.stream-down .num { opacity: 0.4; }
  noscript { display: block; padding: 1.5rem; font-size: 1.5rem; }

  @media (max-aspect-ratio: 1/1) {
    html { font-size: 16px; font-size: calc(100vw / 24.375); }
    body { overflow: auto; }
    .board {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-content: flex-start;
      height: auto;
      min-height: 100%;
      padding: 1rem;
      gap: 0.75rem;
      animation: none;
    }
    .top, .power, .course, .foot { width: 100%; }
    .tile { width: calc(50% - 0.375rem); height: 6.75rem; padding: 0.7rem 0.9rem; }
    .power { height: 12.25rem; padding: 1rem; }
    .hero-num { font-size: 8rem; }
    .hero-w { font-size: 2rem; }
    .zone-name { font-size: 1.35rem; }
    .hero-cap { display: none; }
    .seg { height: 0.85rem; }
    .ladder { width: 1.4rem; margin-right: 0.7rem; }
    .big { font-size: 3.5rem; }
    .unit { font-size: 1.15rem; margin-top: 0.1rem; }
    .badge { width: 2.6rem; height: 2.6rem; }
    .brand { display: block; }
    .brand-name { font-size: 1.55rem; }
    .brand-course { display: none; }
    .totals { display: none; }
    .stream { margin-left: auto; font-size: 1.05rem; }
    .trainer { display: none; }
    .course { height: 9.5rem; }
    .course-live { flex-direction: column; width: 100%; }
    .workout {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto 0.35rem;
    }
    .workout-target { grid-column: 1; grid-row: 2; }
    .workout-time { grid-column: 2; grid-row: 2; font-size: 1.7rem; }
    .workout .track { grid-column: 1 / -1; grid-row: 3; }
    .workout-watts { font-size: 2.6rem; }
    .workout-block, .segment-name { font-size: 1.25rem; }
    .workout-name, .pill, .delta, .erg { font-size: 1.05rem; }
    .segment-time { font-size: 1.5rem; }
    .course-next { display: none; }
    .foot {
      display: flex;
      justify-content: space-between;
      padding: 0.8rem 0.4rem 0.9rem;
    }
    .foot .total { margin: 0; text-align: center; flex: 1; }
    .foot .k { display: block; font-size: 0.85rem; margin: 0 0 0.2rem; }
    .foot .v { font-size: 1.15rem; }
  }
</style>
</head>
<body>
<main class="board" id="board">
  <header class="top">
    <div class="top-row">
    <img class="badge" src="/logo.svg" alt="">
    <div class="brand">
      <div class="brand-name">Penguin Pass</div>
      <div class="brand-course" id="course-name">Ride</div>
    </div>
    <div class="trainer" id="trainer" style="display:none"></div>
    <div class="totals">
      <div class="total" aria-label="Elapsed"><span class="k">Time</span><span class="v num val-time">0:00:00</span></div>
      <div class="total" aria-label="Distance"><span class="k">Dist</span><span class="v num val-dist">&mdash;</span></div>
      <div class="total" aria-label="Elevation"><span class="k">Elev</span><span class="v num val-elev">&mdash;</span></div>
      <div class="total" aria-label="Lap"><span class="k">Lap</span><span class="v num val-lap">&mdash;</span></div>
    </div>
    <div class="stream connecting" id="status">Connecting</div>
    </div>
    <div class="subbar" id="subbar" hidden>
      <div class="pill draft" id="pill-draft" hidden></div>
      <div class="pill fish" id="pill-fish" hidden></div>
      <div class="pill up" id="pill-power" hidden></div>
      <div class="pill reverse" id="pill-reverse" hidden></div>
    </div>
  </header>
  <div class="course-live" id="course-live" hidden>
    <section class="workout" id="workout" hidden aria-label="Workout">
      <div class="workout-copy">
        <div class="workout-name" id="workout-name" hidden></div>
        <div class="workout-block" id="workout-block"></div>
      </div>
      <div class="workout-target">
        <span class="workout-watts num" id="workout-watts"></span>
        <span class="workout-unit">W</span>
        <span class="erg" id="workout-erg" hidden>ERG</span>
      </div>
      <div class="workout-time num" id="workout-time"></div>
      <div class="track" aria-hidden="true"><div class="fill" id="workout-fill"></div></div>
    </section>
    <section class="segment" id="segment" hidden aria-label="Segment">
      <div class="segment-name" id="segment-name"></div>
      <div class="segment-time num" id="segment-time"></div>
      <div class="track" aria-hidden="true"><div class="fill" id="segment-fill"></div></div>
      <div class="delta" id="segment-delta"></div>
    </section>
  </div>
  <section class="power" aria-label="Power">
    <div class="ladder" id="ladder"></div>
    <div class="hero-block">
      <div class="hero-row">
        <div class="hero-num num" id="power">&mdash;</div>
        <div class="hero-w">W</div>
      </div>
      <div class="zone-name" id="zone"></div>
      <div class="hero-cap">Power, 3 s average</div>
    </div>
  </section>
  <section class="tile speed" aria-label="Speed">
    <div class="big num" id="speed">&mdash;</div>
    <div class="unit">km/h</div>
  </section>
  <section class="tile grade" aria-label="Grade">
    <div class="big num" id="grade">&mdash;</div>
    <div class="unit">% grade</div>
  </section>
  <section class="tile cadence" aria-label="Cadence">
    <div class="big num" id="cadence">&mdash;</div>
    <div class="unit">rpm</div>
  </section>
  <section class="tile heart" aria-label="Heart rate">
    <div class="big num" id="heart">&mdash;</div>
    <div class="unit">bpm</div>
  </section>
  <section class="course">
    <div class="course-main">
      <div class="cap">Course</div>
      <canvas id="course-chart"></canvas>
    </div>
    <div class="course-next">
      <div class="cap">Next 1 km</div>
      <canvas id="next-chart"></canvas>
    </div>
  </section>
  <section class="foot">
    <div class="total"><span class="k">Time</span><span class="v num val-time">0:00:00</span></div>
    <div class="total"><span class="k">Dist</span><span class="v num val-dist">&mdash;</span></div>
    <div class="total"><span class="k">Elev</span><span class="v num val-elev">&mdash;</span></div>
    <div class="total"><span class="k">Lap</span><span class="v num val-lap">&mdash;</span></div>
  </section>
</main>
<noscript>This dashboard needs JavaScript.</noscript>
<script type="text/javascript">
(function () {
  var course = { name: "", length_m: 0, points: [] };
  var zones = [];
  var bands = [];
  var latest = null;
  var ride = null;
  var litZone = -1;
  var previewDown = location.search.indexOf("preview=reconnecting") !== -1;
  var previewFeatures = location.search.indexOf("preview=features") !== -1;

  function dash() { return "\u2014"; }
  function missing(value) {
    return value === null || value === undefined || value !== value;
  }
  function setText(id, text, absent) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.className = el.className.replace(" missing", "");
    if (absent) el.className += " missing";
  }
  function setGroup(cls, text, absent) {
    var nodes = document.getElementsByClassName(cls);
    var i;
    for (i = 0; i < nodes.length; i++) {
      nodes[i].textContent = text;
      nodes[i].className = nodes[i].className.replace(" missing", "");
      if (absent) nodes[i].className += " missing";
    }
  }
  function formatPower(value) {
    if (missing(value)) return dash();
    var n = Math.round(Number(value));
    if (n < 0) n = 0;
    if (n > 9999) n = 9999;
    return String(n);
  }
  function formatWhole(value) {
    if (missing(value)) return dash();
    return String(Math.round(Number(value)));
  }
  function formatSpeed(mps) {
    if (missing(mps)) return dash();
    var kph = Number(mps) * 3.6;
    if (kph >= 100) return String(Math.round(kph));
    return kph.toFixed(1);
  }
  function formatGrade(grade) {
    if (missing(grade)) return dash();
    var g = Number(grade);
    if (g > -0.05 && g < 0.05) return "0.0";
    var sign = g > 0 ? "+" : "\u2212";
    return sign + Math.abs(g).toFixed(1);
  }
  function formatKm(metres) {
    if (missing(metres)) return dash();
    var km = Number(metres) / 1000;
    if (km >= 100) return km.toFixed(1);
    return km.toFixed(2);
  }
  function formatElapsed(seconds) {
    if (missing(seconds) || seconds < 0) return dash();
    var total = Math.floor(Number(seconds));
    var h = Math.floor(total / 3600);
    var m = Math.floor((total % 3600) / 60);
    var s = total % 60;
    var mm = (m < 10 ? "0" : "") + m;
    var ss = (s < 10 ? "0" : "") + s;
    return h + ":" + mm + ":" + ss;
  }
  function formatMmss(seconds) {
    if (missing(seconds)) return dash();
    var n = Number(seconds);
    if (missing(n) || n < 0) return dash();
    var total = Math.floor(n);
    if (total > 59999) total = 59999;
    var m = Math.floor(total / 60);
    var s = total % 60;
    var ss = (s < 10 ? "0" : "") + s;
    return m + ":" + ss;
  }
  function clamp01(value) {
    var n = Number(value);
    if (missing(n)) return 0;
    if (n < 0) return 0;
    if (n > 1) return 1;
    return n;
  }
  function clampNum(value, lo, hi) {
    if (missing(value)) return null;
    var n = Number(value);
    if (missing(n)) return null;
    if (n < lo) return lo;
    if (n > hi) return hi;
    return n;
  }
  function cleanLabel(value, max) {
    if (value === null || value === undefined) return "";
    var text = String(value).replace(/[\u0000-\u001F\u007F]/g, "").trim();
    if (text.length > max) text = text.slice(0, max);
    return text;
  }
  function showEl(el, on) {
    if (on) el.removeAttribute("hidden");
    else el.setAttribute("hidden", "");
  }
  function setBar(id, progress) {
    var pct = Math.round(clamp01(progress) * 1000) / 10;
    document.getElementById(id).style.width = pct + "%";
  }
  function gradeColor(grade) {
    var color = "#F4F8FF";
    var i;
    for (i = 0; i < bands.length; i++) {
      if (grade >= bands[i].from_pct) color = bands[i].color;
    }
    return color;
  }
  function heroWatts(t, s) {
    if (s && s.link === "reconnecting" && missing(s.power_3s_w)) return null;
    if (s && !missing(s.power_3s_w)) return s.power_3s_w;
    if (!t || missing(t.power_w)) return null;
    return t.power_w;
  }
  function zoneFor(power, ftp) {
    if (missing(ftp) || ftp <= 0 || missing(power) || power <= 0) return null;
    var ratio = power / ftp;
    var found = null;
    var i;
    for (i = 0; i < zones.length; i++) {
      if (ratio > zones[i].above_ftp) found = zones[i];
    }
    return found;
  }
  function drawLadder(zone) {
    var id = zone ? zone.zone : 0;
    if (id === litZone && document.getElementById("ladder").childNodes.length) return;
    litZone = id;
    var el = document.getElementById("ladder");
    while (el.firstChild) el.removeChild(el.firstChild);
    var z;
    for (z = 7; z >= 1; z--) {
      var step = null;
      var i;
      for (i = 0; i < zones.length; i++) {
        if (zones[i].zone === z) step = zones[i];
      }
      var seg = document.createElement("div");
      seg.className = "seg";
      seg.style.background = step ? step.color : "#7C8AA3";
      if (zone && zone.zone === z) seg.className = "seg on";
      el.appendChild(seg);
    }
  }
  function showStream(state) {
    if (previewDown) state = "reconnecting";
    var el = document.getElementById("status");
    var word = "Connecting";
    if (state === "live") word = "Live";
    if (state === "reconnecting") word = "Reconnecting";
    el.textContent = word;
    el.className = "stream " + state;
    if (state === "reconnecting") document.body.className = "stream-down";
    else document.body.className = "";
  }
  function renderTrainer(s) {
    var el = document.getElementById("trainer");
    if (!s || s.source === "unknown" || !s.source) {
      el.style.display = "none";
      return;
    }
    el.style.display = "";
    if (s.source === "simulated") {
      el.className = "trainer sim";
      el.textContent = "Simulated rider";
      return;
    }
    var name = s.trainer_name ? s.trainer_name : "Trainer";
    if (s.link === "reconnecting") {
      el.className = "trainer warn";
      el.textContent = name + " \u00b7 Reconnecting";
      return;
    }
    if (s.link === "searching") {
      el.className = "trainer warn";
      el.textContent = name + " \u00b7 Searching";
      return;
    }
    if (s.resistance === "reading_only") {
      el.className = "trainer good";
      el.textContent = name + " \u00b7 Reading only";
      return;
    }
    el.className = "trainer good";
    el.textContent = s.resistance === "controlled" ? name + " \u00b7 Resistance on" : name;
  }
  function render(t) {
    latest = t;
    var power = heroWatts(t, ride);
    var zone = ride ? zoneFor(power, ride.ftp_w) : null;
    var coast = !missing(power) && Number(power) <= 0;
    setText("power", formatPower(power), missing(power));
    var zoneEl = document.getElementById("zone");
    if (coast) {
      zoneEl.textContent = "COASTING";
      zoneEl.style.color = "#B4C0D4";
      drawLadder(null);
    } else if (zone) {
      zoneEl.textContent = zone.label;
      zoneEl.style.color = zone.color;
      drawLadder(zone);
    } else {
      zoneEl.textContent = "";
      zoneEl.style.color = "#B4C0D4";
      drawLadder(null);
    }
    var speedMissing = !t || missing(t.speed_mps);
    setText("speed", speedMissing ? dash() : formatSpeed(t.speed_mps), speedMissing);
    var gradeMissing = !t || missing(t.grade_pct);
    var gradeEl = document.getElementById("grade");
    gradeEl.textContent = gradeMissing ? dash() : formatGrade(t.grade_pct);
    gradeEl.style.color = gradeMissing ? "#7C8AA3" : gradeColor(Number(t.grade_pct));
    var cadMissing = !t || missing(t.cadence_rpm);
    setText("cadence", cadMissing ? dash() : formatWhole(t.cadence_rpm), cadMissing);
    var hrMissing = !t || missing(t.heart_rate_bpm);
    setText("heart", hrMissing ? dash() : formatWhole(t.heart_rate_bpm), hrMissing);
    var distMissing = !t || missing(t.distance_m);
    setGroup("val-time", !t || missing(t.elapsed_s) ? dash() : formatElapsed(t.elapsed_s), !t || missing(t.elapsed_s));
    setGroup("val-dist", distMissing ? dash() : formatKm(t.distance_m) + " km", distMissing);
    setGroup("val-elev", !t || missing(t.elevation_m) ? dash() : formatWhole(t.elevation_m) + " m", !t || missing(t.elevation_m));
    setGroup("val-lap", !t || missing(t.lap) ? dash() : String(t.lap), !t || missing(t.lap));
    drawCharts();
  }
  function paintDelta(delta) {
    var el = document.getElementById("segment-delta");
    if (missing(delta) || missing(Number(delta))) {
      el.textContent = "FIRST TRY";
      el.className = "delta first";
      return;
    }
    var n = clampNum(Number(delta), -9999, 9999);
    var tenths = Math.round(Math.abs(n) * 10) / 10;
    var body = tenths.toFixed(1);
    if (n < 0 && tenths > 0) {
      el.textContent = "-" + body + "s";
      el.className = "delta ahead";
      return;
    }
    if (n > 0 && tenths > 0) {
      el.textContent = "+" + body + "s";
      el.className = "delta behind";
      return;
    }
    el.textContent = "0.0s";
    el.className = "delta even";
  }
  function powerupClass(name) {
    var key = name.toLowerCase();
    if (key === "feather") return "pill up feather";
    if (key === "aero") return "pill up aero";
    if (key === "burst") return "pill up burst";
    return "pill up";
  }
  function renderPills(s) {
    var draft = document.getElementById("pill-draft");
    var fish = document.getElementById("pill-fish");
    var power = document.getElementById("pill-power");
    var reverse = document.getElementById("pill-reverse");
    var any = false;
    var saving = clampNum(s ? s.draft_saving_pct : null, 0, 100);
    if (saving !== null && saving > 0) {
      draft.textContent = "DRAFT -" + Math.round(saving) + "%";
      showEl(draft, true);
      any = true;
    } else {
      draft.textContent = "";
      showEl(draft, false);
    }
    var collected = clampNum(s ? s.fish_collected : null, 0, 999999);
    if (collected !== null && collected > 0) {
      var text = "FISH " + Math.round(collected);
      var combo = clampNum(s ? s.fish_combo : null, 0, 999);
      if (combo !== null && combo > 0) text += " \u00b7 x" + Math.round(combo);
      fish.textContent = text;
      showEl(fish, true);
      any = true;
    } else {
      fish.textContent = "";
      showEl(fish, false);
    }
    var up = s ? s.active_powerup : null;
    var raw = up ? cleanLabel(up.name, 16) : "";
    if (raw) {
      var secs = clampNum(up.remaining_s, 0, 999);
      power.className = powerupClass(raw);
      power.textContent = secs === null ? raw.toUpperCase() : raw.toUpperCase() + " " + Math.floor(secs) + "s";
      showEl(power, true);
      any = true;
    } else {
      power.textContent = "";
      power.className = "pill up";
      showEl(power, false);
    }
    if (s && s.course_reversed === true) {
      reverse.textContent = "REVERSE";
      showEl(reverse, true);
      any = true;
    } else {
      reverse.textContent = "";
      showEl(reverse, false);
    }
    showEl(document.getElementById("subbar"), any);
  }
  function renderWorkout(w) {
    var card = document.getElementById("workout");
    if (!w) {
      setBar("workout-fill", 0);
      showEl(card, false);
      return false;
    }
    var name = cleanLabel(w.name, 48);
    var block = cleanLabel(w.block_label, 64);
    var nameEl = document.getElementById("workout-name");
    nameEl.textContent = name;
    showEl(nameEl, name.length > 0);
    document.getElementById("workout-block").textContent = block || dash();
    var wattsMissing = missing(w.target_w) || missing(Number(w.target_w));
    setText("workout-watts", formatPower(w.target_w), wattsMissing);
    showEl(document.getElementById("workout-erg"), w.erg_active === true);
    var timeMissing = missing(w.remaining_s) || missing(Number(w.remaining_s)) || Number(w.remaining_s) < 0;
    setText("workout-time", formatMmss(w.remaining_s), timeMissing);
    setBar("workout-fill", w.progress);
    showEl(card, true);
    return true;
  }
  function renderSegment(seg) {
    var card = document.getElementById("segment");
    if (!seg) {
      setBar("segment-fill", 0);
      showEl(card, false);
      return false;
    }
    var name = cleanLabel(seg.name, 48);
    document.getElementById("segment-name").textContent = name || dash();
    var timeMissing = missing(seg.elapsed_s) || missing(Number(seg.elapsed_s)) || Number(seg.elapsed_s) < 0;
    setText("segment-time", formatMmss(seg.elapsed_s), timeMissing);
    setBar("segment-fill", seg.progress);
    paintDelta(seg.delta_s);
    showEl(card, true);
    return true;
  }
  function syncLive(on) {
    showEl(document.getElementById("course-live"), on);
    document.getElementById("board").className = on ? "board has-live" : "board";
  }
  function featurePreview() {
    return {
      ftp_w: 250,
      source: "trainer",
      trainer_name: "Tacx Neo 2T",
      link: "connected",
      resistance: "controlled",
      power_3s_w: 345,
      workout: {
        name: "Sweet spot",
        block_label: "Interval 2 of 4",
        target_w: 245,
        remaining_s: 134,
        progress: 0.42,
        erg_active: true
      },
      segment: {
        name: "Summit climb",
        elapsed_s: 84,
        progress: 0.55,
        delta_s: -1.4
      },
      draft_saving_pct: 27,
      fish_collected: 12,
      fish_combo: 4,
      active_powerup: { name: "Feather", remaining_s: 14 },
      course_reversed: true
    };
  }
  function renderStatus(s) {
    if (previewFeatures) s = featurePreview();
    ride = s;
    renderTrainer(s);
    var workoutOn = renderWorkout(s && s.workout);
    var segmentOn = renderSegment(s && s.segment);
    renderPills(s);
    syncLive(workoutOn || segmentOn);
    if (latest) render(latest);
    else drawCharts();
    setTimeout(drawCharts, 60);
  }
  function lengthOf() {
    var length = course.length_m;
    var pts = course.points || [];
    if (!length || length <= 0) {
      length = pts.length ? pts[pts.length - 1].distance_m : 1;
    }
    if (!length || length <= 0) length = 1;
    return length;
  }
  function elevAt(distance) {
    var pts = course.points || [];
    var length = lengthOf();
    var d = distance % length;
    if (d < 0) d += length;
    if (!pts.length) return 0;
    if (pts.length === 1) return pts[0].elevation_m;
    if (d <= pts[0].distance_m) return pts[0].elevation_m;
    var i;
    for (i = 1; i < pts.length; i++) {
      if (d <= pts[i].distance_m) {
        var a = pts[i - 1];
        var b = pts[i];
        var span = b.distance_m - a.distance_m;
        if (span <= 0) return b.elevation_m;
        var t = (d - a.distance_m) / span;
        return a.elevation_m + (b.elevation_m - a.elevation_m) * t;
      }
    }
    return pts[pts.length - 1].elevation_m;
  }
  function gradeAt(distance) {
    var step = 8;
    var a = elevAt(distance);
    var b = elevAt(distance + step);
    return (b - a) / step * 100;
  }
  function prepare(canvas) {
    var cssW = canvas.clientWidth;
    var cssH = canvas.clientHeight;
    if (cssW < 8 || cssH < 8) return null;
    var dpr = window.devicePixelRatio || 1;
    var pw = Math.round(cssW * dpr);
    var ph = Math.round(cssH * dpr);
    if (canvas.width !== pw || canvas.height !== ph) {
      canvas.width = pw;
      canvas.height = ph;
    }
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    return { ctx: ctx, w: cssW, h: cssH };
  }
  function scaleElev(samples) {
    var minE = samples[0];
    var maxE = samples[0];
    var i;
    for (i = 1; i < samples.length; i++) {
      if (samples[i] < minE) minE = samples[i];
      if (samples[i] > maxE) maxE = samples[i];
    }
    var span = maxE - minE;
    if (span < 60) {
      var mid = (minE + maxE) / 2;
      minE = mid - 30;
      maxE = mid + 30;
      span = 60;
    }
    return { floor: minE - 0.22 * span, top: maxE };
  }
  function fontPx(px) {
    var root = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    return Math.max(12, px / 16 * root);
  }
  function drawCharts() {
    drawCourse();
    drawNext();
  }
  function drawCourse() {
    var view = prepare(document.getElementById("course-chart"));
    if (!view) return;
    var ctx = view.ctx;
    var w = view.w;
    var h = view.h;
    var padB = fontPx(22);
    var plotH = h - padB;
    var pts = course.points || [];
    if (pts.length < 2) {
      ctx.fillStyle = "#B4C0D4";
      ctx.font = "600 " + fontPx(24) + "px Barlow Semi Condensed, Arial, sans-serif";
      ctx.fillText("No course", 8, fontPx(36));
      return;
    }
    var length = lengthOf();
    var cols = Math.max(24, Math.floor(w / 4));
    var elevs = [];
    var i;
    for (i = 0; i <= cols; i++) elevs.push(elevAt(length * i / cols));
    var scale = scaleElev(elevs);
    var span = scale.top - scale.floor;
    if (span < 1) span = 1;
    function yAt(elev) {
      return 4 + (1 - (elev - scale.floor) / span) * (plotH - 10);
    }
    var rider = 0;
    if (latest && !missing(latest.lap_distance_m)) rider = latest.lap_distance_m;
    var riderX = (rider % length) / length * w;
    for (i = 0; i < cols; i++) {
      var d0 = length * i / cols;
      var x0 = w * i / cols;
      var x1 = w * (i + 1) / cols + 1;
      var y0 = yAt(elevs[i]);
      var y1 = yAt(elevs[i + 1]);
      ctx.beginPath();
      ctx.moveTo(x0, plotH);
      ctx.lineTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.lineTo(x1, plotH);
      ctx.closePath();
      ctx.fillStyle = d0 < rider ? "#66728A" : gradeColor(gradeAt(d0));
      ctx.fill();
    }
    ctx.beginPath();
    for (i = 0; i <= cols; i++) {
      var x = w * i / cols;
      var y = yAt(elevs[i]);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = "rgba(244, 248, 255, 0.75)";
    ctx.lineWidth = 1.25;
    ctx.stroke();
    var ahead = Math.min(length, 1000);
    ctx.beginPath();
    ctx.moveTo(riderX, yAt(elevAt(rider)));
    var steps = 24;
    for (i = 1; i <= steps; i++) {
      var dd = rider + ahead * i / steps;
      var xx = (dd % length) / length * w;
      if (xx < riderX && i > 1) break;
      ctx.lineTo(xx, yAt(elevAt(dd)));
    }
    ctx.strokeStyle = "#F4F8FF";
    ctx.lineWidth = 3;
    ctx.stroke();
    var ry = yAt(elevAt(rider));
    ctx.beginPath();
    ctx.moveTo(riderX, ry);
    ctx.lineTo(riderX, plotH);
    ctx.strokeStyle = "#0B1220";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.strokeStyle = "#F4F8FF";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(riderX, ry, 6, 0, Math.PI * 2);
    ctx.fillStyle = "#F4F8FF";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#0B1220";
    ctx.stroke();
    ctx.fillStyle = "#B4C0D4";
    ctx.font = "500 " + fontPx(18) + "px Barlow Semi Condensed, Arial, sans-serif";
    var marks = w < 520 ? 3 : 6;
    for (i = 0; i < marks; i++) {
      var km = length / 1000 * i / (marks - 1);
      var label = km.toFixed(km >= 10 || km < 0.05 ? 0 : 1);
      if (i === 0) label = "0 km";
      if (i === marks - 1) label = (length / 1000).toFixed(length >= 100000 ? 0 : 1) + " km";
      var lx = w * i / (marks - 1);
      if (i === 0) {
        ctx.textAlign = "left";
        lx = 2;
      } else if (i === marks - 1) {
        ctx.textAlign = "right";
        lx = w - 2;
      } else {
        ctx.textAlign = "center";
      }
      ctx.fillText(label, lx, h - 2);
    }
    ctx.textAlign = "left";
  }
  function drawNext() {
    var canvas = document.getElementById("next-chart");
    if (!canvas || canvas.parentNode.style.display === "none") return;
    var view = prepare(canvas);
    if (!view) return;
    var ctx = view.ctx;
    var w = view.w;
    var h = view.h;
    var pts = course.points || [];
    if (pts.length < 2) return;
    var length = lengthOf();
    var rider = 0;
    if (latest && !missing(latest.lap_distance_m)) rider = latest.lap_distance_m;
    var windowM = 1000;
    var cols = Math.max(20, Math.floor(w / 4));
    var elevs = [];
    var i;
    for (i = 0; i <= cols; i++) elevs.push(elevAt(rider + windowM * i / cols));
    var scale = scaleElev(elevs);
    var span = scale.top - scale.floor;
    if (span < 1) span = 1;
    var plotH = h - fontPx(20);
    function yAt(elev) {
      return 2 + (1 - (elev - scale.floor) / span) * (plotH - 8);
    }
    for (i = 0; i < cols; i++) {
      var x0 = w * i / cols;
      var x1 = w * (i + 1) / cols + 1;
      ctx.beginPath();
      ctx.moveTo(x0, plotH);
      ctx.lineTo(x0, yAt(elevs[i]));
      ctx.lineTo(x1, yAt(elevs[i + 1]));
      ctx.lineTo(x1, plotH);
      ctx.closePath();
      ctx.fillStyle = gradeColor(gradeAt(rider + windowM * i / cols));
      ctx.fill();
    }
    ctx.beginPath();
    for (i = 0; i <= cols; i++) {
      var x = w * i / cols;
      var y = yAt(elevs[i]);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = "#F4F8FF";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(6, yAt(elevs[0]), 5, 0, Math.PI * 2);
    ctx.fillStyle = "#F4F8FF";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#0B1220";
    ctx.stroke();
    ctx.fillStyle = "#B4C0D4";
    ctx.font = "500 " + fontPx(18) + "px Barlow Semi Condensed, Arial, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("now", 0, h - 2);
    ctx.textAlign = "center";
    ctx.fillText("500 m", w * 0.5, h - 2);
    ctx.textAlign = "right";
    ctx.fillText("1 km", w, h - 2);
    ctx.textAlign = "left";
  }
  function loadJson(url, done) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.onload = function () {
      if (xhr.status !== 200) return;
      var data;
      try { data = JSON.parse(xhr.responseText); }
      catch (e) { return; }
      done(data);
    };
    xhr.send();
  }
  function connect() {
    if (!window.EventSource) {
      poll();
      return;
    }
    var es = new EventSource("/events");
    es.onopen = function () { showStream("live"); };
    es.onerror = function () { showStream("reconnecting"); };
    es.onmessage = function (ev) {
      var data;
      try { data = JSON.parse(ev.data); }
      catch (e) { return; }
      render(data);
    };
    es.addEventListener("status", function (ev) {
      var data;
      try { data = JSON.parse(ev.data); }
      catch (e) { return; }
      renderStatus(data);
    });
  }
  var courseStamp = "";
  function applyCourse(data) {
    if (!data) return;
    var pts = data.points || [];
    var head = pts.length ? pts[0].elevation_m : 0;
    var tail = pts.length ? pts[pts.length - 1].elevation_m : 0;
    var stamp = (data.name || "") + "|" + data.length_m + "|" + pts.length + "|" + head + "|" + tail;
    if (stamp === courseStamp) return;
    courseStamp = stamp;
    course = data;
    var label = course.name;
    if (!label) {
      var km = (course.length_m || 0) / 1000;
      label = km > 0 ? km.toFixed(1) + " km loop" : "Ride";
    }
    document.getElementById("course-name").textContent = label;
    drawCharts();
  }
  function poll() {
    loadJson("/api/telemetry", function (data) { render(data); });
    loadJson("/api/status", function (data) { renderStatus(data); });
    loadJson("/api/course", applyCourse);
    setTimeout(poll, 250);
  }
  function holdWake() {
    if (!navigator.wakeLock || !navigator.wakeLock.request) return;
    navigator.wakeLock.request("screen").then(function () {}, function () {});
  }
  loadJson("/api/zones", function (data) {
    zones = data.power || [];
    bands = data.gradient || [];
    litZone = -2;
    if (latest) render(latest);
  });
  loadJson("/api/course", applyCourse);
  loadJson("/api/status", function (data) { renderStatus(data); });
  loadJson("/api/telemetry", function (data) { render(data); });
  showStream("connecting");
  if (previewFeatures) renderStatus(null);
  connect();
  holdWake();
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") holdWake();
  });
  window.onresize = function () { drawCharts(); };
  setTimeout(drawCharts, 60);
})();
</script>

name: Rust setup
description: >
  Install the toolchain pinned in rust-toolchain.toml, cache cargo
  outputs, and install the system packages a later btleplug crate links.

runs:
  using: composite
  steps:
    - name: Install the Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        # Default is "deny", which would make cargo check and cargo test
        # stricter than ./x. Clippy still passes "-D warnings" itself.
        build-warnings: ""
        cache: true

    - name: Install link dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo DEBIAN_FRONTEND=noninteractive apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libdbus-1-dev

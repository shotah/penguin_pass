# Reusable rust + export jobs for one desktop OS. Callers own triggers and release.

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      label:
        required: true
        type: string
      target:
        required: true
        type: string
      lib:
        required: true
        type: string
      zip_name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ inputs.label }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: ""
          cache: true

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build the release library
        shell: bash
        env:
          LIB: ${{ inputs.lib }}
        run: |
          set -euo pipefail
          mkdir -p godot/bin
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            cargo build -p pp-godot --release --target aarch64-apple-darwin
            cargo build -p pp-godot --release --target x86_64-apple-darwin
            lipo -create \
              target/aarch64-apple-darwin/release/libpp_godot.dylib \
              target/x86_64-apple-darwin/release/libpp_godot.dylib \
              -output "godot/bin/$LIB"
          else
            cargo build -p pp-godot --release
            cp -f target/release/pp_godot.dll "godot/bin/$LIB"
          fi

      - name: Upload the library
        uses: actions/upload-artifact@v7
        with:
          name: native-lib-${{ inputs.label }}
          path: godot/bin/${{ inputs.lib }}
          if-no-files-found: error
          retention-days: 5

  export:
    name: export (${{ inputs.label }})
    needs: rust
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Download the library
        uses: actions/download-artifact@v8
        with:
          name: native-lib-${{ inputs.label }}
          path: godot/bin

      - name: Export the player
        uses: ./.github/actions/godot-export
        with:
          target: ${{ inputs.target }}

      - name: Zip the export
        shell: bash
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          python3 - "$ZIP_NAME" "$TARGET" <<'PY'
          import os
          import pathlib
          import stat
          import sys
          import zipfile

          name, target = sys.argv[1:]
          dist = pathlib.Path("dist")
          dest = dist / name

          def add_path(archive: zipfile.ZipFile, path: pathlib.Path, arcname: str) -> None:
              st = os.lstat(path)
              mode = st.st_mode & 0xFFFF
              if stat.S_ISLNK(st.st_mode):
                  info = zipfile.ZipInfo(arcname)
                  info.create_system = 3
                  info.external_attr = mode << 16
                  archive.writestr(info, os.readlink(path))
              elif stat.S_ISREG(st.st_mode):
                  info = zipfile.ZipInfo.from_file(path, arcname)
                  info.external_attr = mode << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  with path.open("rb") as handle:
                      archive.writestr(info, handle.read())

          if target == "windows":
              folder = dist / "penguin-pass-windows-x86_64"
              if not (folder / "penguin-pass.exe").is_file():
                  raise SystemExit(f"missing {folder / 'penguin-pass.exe'}")
              arc_root = folder.parent
          elif target == "macos":
              folder = dist / "penguin-pass-macos"
              exe = folder / "penguin-pass.app" / "Contents" / "MacOS" / "Penguin Pass"
              if not exe.is_file():
                  raise SystemExit(f"missing {exe}")
              arc_root = folder
          else:
              raise SystemExit(f"zip: unexpected target {target!r}")

          with zipfile.ZipFile(dest, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(folder.rglob("*"), key=lambda p: p.as_posix()):
                  rel = path.relative_to(arc_root).as_posix()
                  if path.is_symlink():
                      add_path(archive, path, rel)
                  elif path.is_file():
                      add_path(archive, path, rel)

          if target == "macos":
              verify_entry = "penguin-pass.app/Contents/MacOS/Penguin Pass"
              with zipfile.ZipFile(dest, "r") as archive:
                  try:
                      info = archive.getinfo(verify_entry)
                  except KeyError:
                      raise SystemExit(f"zip verify: missing {verify_entry!r}") from None
                  unix_mode = (info.external_attr >> 16) & 0o777
                  if unix_mode & 0o111 == 0:
                      raise SystemExit(
                          f"zip verify: {verify_entry!r} is not executable (mode {oct(unix_mode)})"
                      )

          print(dest, dest.stat().st_size)
          PY

      - name: Upload the player zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.zip_name }}
          path: dist/${{ inputs.zip_name }}
          if-no-files-found: error
          retention-days: 14
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1232 706" width="1232" height="706" role="img" aria-labelledby="title desc">
  <title id="title">Penguin Pass</title>
  <desc id="desc">Steam main capsule. A cycling penguin charging up a sunny green alpine pass with snow-capped mountains, pines, a winding road, an elevation profile, and the Penguin Pass title.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A7CE0"/>
      <stop offset="56%" stop-color="#5EC0FA"/>
      <stop offset="100%" stop-color="#CFF0FF"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.96"/>
      <stop offset="48%" stop-color="#FFE066" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meadowMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60BE56"/>
      <stop offset="100%" stop-color="#358644"/>
    </linearGradient>
    <linearGradient id="meadowFore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B8E47"/>
      <stop offset="100%" stop-color="#1E522E"/>
    </linearGradient>
    <linearGradient id="profileFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="roadClip">
      <path d="M-20 424 C190 382 410 412 694 398 C910 386 1080 416 1252 400 V720 H-20 Z"/>
    </clipPath>
  </defs>

  <!-- Bright summer alpine sky -->
  <rect width="1232" height="706" fill="url(#sky)"/>

  <!-- Radiant golden sun cleanly in upper-right sky -->
  <circle cx="1016" cy="134" r="162" fill="url(#sunGlow)"/>
  <circle cx="1016" cy="134" r="48" fill="#FFE169"/>

  <!-- Soft clouds placed cleanly below/clear of the wordmark and peaks -->
  <g fill="#FFFFFF" opacity="0.82">
    <path d="M806 140 C806 126 818 116 832 118 C842 103 868 102 880 115 C894 113 908 124 906 140 Z" opacity="0.76"/>
    <path d="M1108 176 C1108 164 1118 156 1130 158 C1138 146 1158 145 1168 156 C1179 154 1190 163 1188 176 Z" opacity="0.72"/>
    <path d="M36 226 C36 214 46 205 59 207 C68 195 88 194 98 205 C110 203 121 213 119 226 Z" opacity="0.68"/>
  </g>

  <!-- Distant hazy alpine ridgeline -->
  <path d="M-20 392 L110 318 L244 362 L408 296 L562 354 L726 300 L896 346 L1056 292 L1252 332 L1252 440 L-20 440 Z" fill="#6396C6" opacity="0.5"/>

  <!-- Three sunlit snow-capped alpine peaks framing the pass saddle at x=694 -->
  <path d="M-20 454 L196 226 L418 454 Z" fill="#4B78A6"/>
  <path d="M196 226 L418 454 L256 454 Z" fill="#375E87"/>
  <path d="M196 226 L236 284 L218 276 L202 292 L184 276 L168 290 L154 278 Z" fill="#F4F9FF" opacity="0.92"/>

  <path d="M284 454 L528 176 L724 454 Z" fill="#46729E"/>
  <path d="M528 176 L724 454 L584 454 Z" fill="#355B82"/>
  <path d="M528 176 L576 244 L556 234 L536 254 L516 234 L496 250 L478 238 Z" fill="#F4F9FF" opacity="0.93"/>

  <path d="M686 454 L942 194 L1212 454 Z" fill="#5282B0"/>
  <path d="M942 194 L1212 454 L1006 454 Z" fill="#3C6791"/>
  <path d="M942 194 L988 260 L968 270 L948 250 L928 272 L908 252 L890 264 Z" fill="#F4F9FF" opacity="0.91"/>

  <!-- Mid sunlit green alpine meadow -->
  <path d="M-20 424 C190 382 410 412 694 398 C910 386 1080 416 1252 400 V706 H-20 Z" fill="url(#meadowMid)"/>

  <!-- Natural clustered pine groves on the hillsides -->
  <g>
    <path d="M36 452 L54 388 L72 452 Z" fill="#1F6338"/>
    <path d="M41 422 L54 374 L67 422 Z" fill="#2D854C"/>
    <path d="M76 462 L98 380 L120 462 Z" fill="#1A5430"/>
    <path d="M83 424 L98 364 L113 424 Z" fill="#2B8049"/>

    <path d="M448 446 L466 380 L484 446 Z" fill="#226B3D"/>
    <path d="M453 416 L466 366 L479 416 Z" fill="#308C50"/>
    <path d="M484 456 L508 370 L532 456 Z" fill="#1B5932"/>
    <path d="M491 416 L508 354 L525 416 Z" fill="#2B8049"/>
    <path d="M534 452 L550 396 L566 452 Z" fill="#1F6338"/>

    <path d="M840 444 L860 374 L880 444 Z" fill="#226B3D"/>
    <path d="M846 412 L860 360 L874 412 Z" fill="#308C50"/>
    <path d="M884 454 L910 362 L936 454 Z" fill="#1B5932"/>
    <path d="M892 412 L910 344 L928 412 Z" fill="#2B8049"/>
    <path d="M936 448 L954 386 L972 448 Z" fill="#1F6338"/>

    <path d="M1070 456 L1092 376 L1114 456 Z" fill="#1F6338"/>
    <path d="M1076 420 L1092 360 L1108 420 Z" fill="#2D854C"/>
    <path d="M1116 466 L1144 366 L1172 466 Z" fill="#1A5430"/>
    <path d="M1124 420 L1144 348 L1164 420 Z" fill="#2B8049"/>
    <path d="M1170 460 L1190 392 L1210 460 Z" fill="#226B3D"/>
  </g>

  <!-- Foreground sunlit meadow -->
  <path d="M-20 516 C280 466 640 538 1252 486 V706 H-20 Z" fill="url(#meadowFore)"/>

  <!-- Clean sweeping S-curve alpine pass road vanishing over the saddle at (692, 398) -->
  <g clip-path="url(#roadClip)">
    <path d="M432 714 C484 612 526 530 584 476 C622 442 652 420 676 398 L704 398 C684 424 662 450 644 486 C618 538 648 616 642 714 Z" fill="#364054"/>
    <g fill="none" stroke="#F8FAFC" stroke-linecap="round">
      <path d="M432 714 C484 612 526 530 584 476 C622 442 652 420 676 398" stroke-width="8"/>
      <path d="M642 714 C648 616 618 538 644 486 C662 450 684 424 704 398" stroke-width="8"/>
      <path d="M537 714 C566 614 572 534 614 481 C642 446 668 422 690 398" stroke-width="5.2" stroke-dasharray="22 18"/>
    </g>
  </g>

  <!-- Foreground framing pines on right -->
  <g>
    <path d="M776 544 L796 472 L816 544 Z" fill="#184C2C"/>
    <path d="M782 510 L796 456 L810 510 Z" fill="#267342"/>
    <path d="M824 556 L848 468 L872 556 Z" fill="#144025"/>
    <path d="M831 516 L848 450 L865 516 Z" fill="#21663A"/>
  </g>

  <!-- Heroic cycling penguin head mascot charging rightward -->
  <image href="mascot.svg" x="46" y="256" width="374" height="374"/>

  <!-- Commanding PENGUIN PASS title in clear upper-left sky -->
  <g font-family="Barlow Semi Condensed" font-weight="700" text-anchor="start">
    <text x="64" y="152" font-size="118" fill="#0B1220" opacity="0.36" letter-spacing="3.5" transform="translate(0 7)">PENGUIN PASS</text>
    <text x="64" y="152" font-size="118" fill="#FFFFFF" stroke="#0B1220" stroke-width="13" paint-order="stroke" stroke-linejoin="round" letter-spacing="3.5">PENGUIN PASS</text>
  </g>

  <!-- Power-zone course elevation profile along bottom-right -->
  <path d="M726 666 L792 658 L858 642 L924 622 L990 606 L1052 598 L1116 612 L1182 628 L1182 706 L726 706 Z" fill="url(#profileFill)"/>
  <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M726 666 L792 658" stroke="#CBD5E1"/>
    <path d="M792 658 L858 642" stroke="#4ADE80"/>
    <path d="M858 642 L924 622" stroke="#FFE066"/>
    <path d="M924 622 L990 606" stroke="#FF9A3C"/>
    <path d="M990 606 L1052 598" stroke="#FF5A52"/>
    <path d="M1052 598 L1116 612" stroke="#D277FF"/>
    <path d="M1116 612 L1182 628" stroke="#5CE1FF"/>
  </g>
  <circle cx="1052" cy="598" r="9" fill="#FFFFFF" stroke="#0B1220" stroke-width="3.5"/>
</svg>

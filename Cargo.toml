[workspace]
resolver = "2"
# Glob on purpose: crates added under crates/ join the workspace without an edit here.
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.3"
license = "MIT"
publish = false

# The terrain maths lives in pp-view and runs a few hundred thousand times
# while a course loads. Unoptimised, that is most of a debug start-up.
[profile.dev.package.pp-view]
opt-level = 3

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

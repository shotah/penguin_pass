<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Font check only: bundled font plus the system fonts, so a wrong family
     name falls back to a visibly different face. Not used for mockups. -->
<fontconfig>
  <dir prefix="relative">../../../../godot/assets/fonts</dir>
  <dir>/usr/share/fonts</dir>
  <cachedir>/tmp/penguin-pass-ui-fontcache-verify</cachedir>
</fontconfig>

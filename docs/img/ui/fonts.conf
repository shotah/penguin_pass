<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Used only by render.sh. It makes rsvg-convert see the bundled game font
     and nothing else, so a glyph the game font lacks shows as a box in the
     mockup instead of being borrowed from a system font. Nothing is
     installed. The directory is relative to this file. -->
<fontconfig>
  <dir prefix="relative">../../../godot/assets/fonts</dir>
  <cachedir>/tmp/penguin-pass-ui-fontcache</cachedir>
  <!-- No hinting: stems keep their true weight at 18 to 24 px. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
